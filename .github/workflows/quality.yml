name: Repository quality
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .quality/package-lock.json
      - run: python tools/install_ci_tools.py .quality/bin
      - run: python -m pip install ruff==0.16.9 pip-audit==2.10.0
      - run: npm ci --prefix .quality
      - run: ./.quality/node_modules/.bin/playwright install --with-deps chromium
      - name: Check outgoing history, workflows, docs and synthetic browser behavior
        env:
          QUALITY_BASE: ${{ github.event.before }}
        run: python tools/quality.py --mode ci
