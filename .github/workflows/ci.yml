name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install integration dependencies
        run: python -m pip install -r requirements-integration.txt
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q apps packages services tools tests
      - name: Check browser JavaScript syntax
        run: |
          node --check webapp/app.js
          node --check tools/lidar_wound_progress/webapp/app.js
          node --check tools/lidar_wound_progress/webapp/depth-adapter.js
      - name: Run deterministic frontend audit
        run: python tools/frontend_agent/frontend_agent.py audit --json
      - name: Check whitespace
        run: git diff --check
