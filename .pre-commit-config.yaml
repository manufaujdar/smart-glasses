minimum_pre_commit_version: '4.6.2'
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: staged-quality
        name: Staged secrets, syntax and changed engineering docs
        entry: python3 tools/quality.py --mode staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: push-quality
        name: Exact outgoing commit, native checks and synthetic QA
        entry: python3 tools/quality.py --mode push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
